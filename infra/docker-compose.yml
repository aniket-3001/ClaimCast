# Local development stack. Ports are offset from the defaults so this cannot
# collide with a Postgres someone already has running on their machine.
services:
  db:
    image: postgres:16-alpine
    container_name: claimcast-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claimcast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimcast}
      POSTGRES_DB: ${POSTGRES_DB:-claimcast}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - claimcast-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claimcast} -d ${POSTGRES_DB:-claimcast}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The cost model. The API refuses to forecast at all unless ML_SERVICE_URL
  # points at this, because there is deliberately no fallback estimate:
  #   ML_SERVICE_URL=http://localhost:${ML_PORT:-8001} npm run dev -w apps/api
  ml:
    build:
      context: ..
      dockerfile: infra/ml.Dockerfile
    container_name: claimcast-ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  claimcast-pgdata:
